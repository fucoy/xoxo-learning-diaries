<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Administrator login for XOXO Learning Diaries"
    >

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f9fcff">

    <link
        rel="icon"
        href="/favicon.svg"
        type="image/svg+xml"
    >

    <link
        rel="stylesheet"
        href="/admin/admin.css"
    >

    <title>Admin Login | XOXO Learning Diaries</title>
</head>

<body>

<main class="login-page">

    <section class="login-brand">

        <a
            href="/"
            class="admin-logo"
            aria-label="Return to XOXO Learning Diaries"
        >
            XOXO.
        </a>

        <p class="login-label">
            ADMINISTRATOR ACCESS
        </p>

        <h1>
            Welcome<br>
            <span>back.</span>
        </h1>

        <p class="login-description">
            Sign in to create, edit, publish, and manage
            your personal learning diary entries.
        </p>

    </section>

    <section class="login-card">

        <div class="login-card-header">
            <span>ADMIN PASS</span>
            <span aria-hidden="true">✦ ✦ ✦</span>
        </div>

        <h2>Sign in</h2>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    EMAIL ADDRESS
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginButton"
            >
                LOGIN TO DASHBOARD
                <span aria-hidden="true">→</span>
            </button>

            <p
                id="loginMessage"
                class="login-message"
                aria-live="polite"
            ></p>

        </form>

        <a href="/" class="back-home">
            ← BACK TO HOME
        </a>

    </section>

</main>

<script
    type="module"
    src="/admin/login.js"
></script>

</body>
</html>
